<!--
  M5 第 3+4 批 · 新手引导 / 帮助中心 DOM 片段
  ====================================================================
  这个文件**不参与构建**，它只是"请把下面这些节点插进 index.html"的清单
  （并发编辑期间 index.html 由对方持有，所以这里不直接改它）。

  需要什么：

  A. `src/ui/HelpCenter.ts`  → `#help-panel`（**只要一个空容器**）
     · 分类按钮条、搜索框、状态行、`#help-list` 全部由代码生成 —— 因为分类与条目
       都来自 `HELP_TOPICS` / `HELP_CATEGORIES`，写死在 HTML 里必然迟早对不上。
     · 构造函数收的是 `HTMLElement | null`：容器缺失时**不抛异常**（搜索照常工作，
       只是画不出来），但那样玩家就看不到帮助了，所以还是建议插上。
     · 面板本身是 `<aside class="panel">` + `<details>`，与既有面板（`#map-template-panel`
       / `#content-stats-panel`）保持同一套折叠样式。

  B. 新手引导提示层 → `#onboarding-tip`（Engine 每帧按 `Onboarding.update()` 返回的
     `step` 往这几个节点里写字）
     · ⚠ `src/tutorial/Onboarding.ts` **自己不碰 DOM**（这样才能在 Node 里断言），
       所以这一层的节点与读写都由 Engine 负责。需要的 id 就是下面这 6 个。
     · `#onboarding-tip` 必须 `pointer-events: none`，只有卡片本身 `pointer-events: auto`：
       引导在屏幕上时玩家**照样可以转视角、放东西**（这恰恰是重点 ——
       边做边学，做完这一步就自动进下一步）。把整层做成拦截点击的遮罩会让
       "引导说的那件事"根本没法做，这是最容易踩的一个坑。
     · 层级定 55：高过提示条（45）与主菜单（50），低于手势教学卡片（60）。

  C. 工具栏按钮 → `data-action="help"`（Engine 的 toolbar 分支里加一个 case 即可）
     · 建议绑定 **H 键**：核对过 `Engine.handleKeyDown` 与 `ui/ShortcutHelp.ts`，
       A B D E G J K M N O P Q R S V Y Z 都已被占用，**H 是空的**。
       （F1 / Shift+/ 已经是快捷键速查表，不要抢。）

  插入位置：
  1. A 放在既有侧栏面板区（建议紧跟 `#content-pack-panel` 之后），与它们同类；
  2. B 放在 `<div id="app">` 内、`<header id="main-toolbar">` 之后（浮层，与
     `#hint-banner` 同级）；
  3. C 放在 `#main-toolbar` 最左侧那个 `.group` 里，紧挨 `#btn-tutorial`。
-->

<!-- ================= A. 帮助中心（容器留空，内容全由 HelpCenter 生成） ================= -->
<aside id="help-panel" class="panel">
  <details open>
    <summary>❓ 帮助中心（按 H 打开 / 收起）</summary>
    <!--
      这个 div 就是 HelpCenter 的构造参数：它会把分类按钮条、搜索框、状态行、
      条目列表依次 append 进来。**不要**在这里预置任何子节点 ——
      `render()` 是整体重画列表，预置的节点会被当成"上一次的残留"直接丢掉。
    -->
    <div id="help-center-body"></div>
  </details>
</aside>

<!-- ================= B. 新手引导提示层 ================= -->
<!--
  pointer-events:none 是必须的（见文件头 B 条）：引导层只能"提示"，不能"拦住操作"。
  卡片本身再单独打开 pointer-events:auto，这样三个按钮点得动。
-->
<div
  id="onboarding-tip"
  style="
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    z-index: 55;
    pointer-events: none;
    display: none;
    max-width: min(560px, calc(100vw - 24px));
  "
>
  <div
    id="onboarding-card"
    style="
      pointer-events: auto;
      background: rgba(16, 20, 24, 0.94);
      border: 1px solid #2b3640;
      border-radius: 8px;
      color: #d8e2ea;
      padding: 10px 12px;
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    "
  >
    <!-- 「第 3 / 7 步」——Engine 写 `第 ${ob.index + 1} / ${ob.total} 步` -->
    <div id="onboarding-step" style="color: #8b9aa8; font-size: 12px"></div>
    <!-- 步骤标题（step.title） -->
    <div id="onboarding-title" style="font-weight: 700; margin: 2px 0 4px"></div>
    <!-- 步骤正文（step.body） -->
    <div id="onboarding-body" style="color: #c6d2dc"></div>
    <!-- 三个按钮：都写 type="button"，并强制 ≥44px 高（手机可点面积要求） -->
    <div style="display: flex; gap: 6px; margin-top: 8px">
      <button type="button" id="onboarding-next" style="min-height: 44px; flex: 1">下一步</button>
      <button type="button" id="onboarding-skip" style="min-height: 44px; flex: 1">跳过引导</button>
      <button type="button" id="onboarding-restart" style="min-height: 44px; flex: 1; display: none">再看一次</button>
    </div>
  </div>
</div>

<!-- ================= C. 工具栏按钮（插在 #main-toolbar 第一个 .group 里） ================= -->
<!-- 与 #btn-tutorial 并排：两者都是"教学类"入口，放一起玩家才找得到 -->
<button type="button" data-action="help" id="btn-help" title="帮助中心（H）：按主题查操作，每条都能一键打开示例">❓ 帮助</button>
